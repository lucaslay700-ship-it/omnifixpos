name: omnifixpos
description: "OmniFix Enterprise POS - Multi-Tenant Offline-First Mobile Repair SaaS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Language model error မတက်အောင် SDK range ကို ကျယ်ပေးထားပါသည်


environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

    # ဒီလိုင်းများ အပြည့်အဝ ပါရပါမည်
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.1
  firebase_auth: ^5.1.0
  connectivity_plus: ^6.0.3
  http: ^1.2.1

  # Native Hardware & UI Utilities
  flutter_spinkit: ^5.2.1
